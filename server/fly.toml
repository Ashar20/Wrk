app = "wrk-validator"
primary_region = "sin"

[build]

[env]
  PORT = "8080"
  WRK_DATA_DIR = "/data"

[mounts]
  source = "wrk_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
